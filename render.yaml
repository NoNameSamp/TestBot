services:
  - type: web
    name: vika-birthday-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHAT_ID
        sync: false
      - key: BIRTHDAY_NAME
        value: Вику
      - key: BUTTON_TEXT
        value: "🎉 Поздравить Вику с Днём Рождения"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: INTERVAL_SECONDS
        value: "10800"
